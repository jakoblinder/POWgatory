[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "powgatory"
dynamic = ["version"]   # Read from powgatory.__version__
description = "POWHEG-BOX workflow orchestration using b2luigi"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Jakob Linder"},
]
keywords = ["powheg", "physics", "workflow", "luigi", "b2luigi", "slurm", "hpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"   # Matches the b2luigi fork providing array/mpi submission
dependencies = [
    # BELLE2 Luigi variant. The fork's "powgatory" branch combines two changes that are not part
    # of any b2luigi release yet: Slurm array/mpi submission ("submission_type", belle2/b2luigi#6)
    # and allowing tenacity 9, which the luigi pin below needs.
    "b2luigi @ git+https://github.com/jakoblinder/b2luigi.git@powgatory",
    # Workflow orchestration. Pinned to a commit after v3.8.1 because no luigi release supports
    # Python 3.14 yet (support was added in spotify/luigi#3433). Go back to a release once one does.
    "luigi @ git+https://github.com/spotify/luigi.git@f5feb7a4655ad73ef56f0ab04d7903ab43b63e12",
    "pyyaml>=5.4",      # YAML configuration
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/jakoblinder/POWgatory"

[project.scripts]
powgatory = "powgatory.cli:run_workflow"

[tool.setuptools.dynamic]
version = {attr = "powgatory.__version__"}

[tool.setuptools.packages.find]
include = ["powgatory*"]

# Files read at runtime; they must be part of the installed package, not just the checkout.
[tool.setuptools.package-data]
powgatory = [
    "config/*.yaml",
    "config/*.sh",
    "config/pwgseeds.dat-save",
    "scripts/*.sh",
]
