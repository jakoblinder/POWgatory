# POWHEG-BOX Run Configuration
# Minimal configuration for a POWHEG run
#
# Usage: powheg-workflow run.yaml
# ============================================================================
# POWHEG FILES (in current directory)
# ============================================================================
powheg_executable: "./pwhg_main"
powheg_input_template: "powheg.input-save"
powheg_seeds_template: "pwgseeds.dat-save"  # Optional

# ============================================================================
# JOB SUBMISSION SETTINGS
# ============================================================================
job_settings:
  job_name: "powheg"
  mail_type: "End,Fail"
  mail_user: "linder@mpp.mpg.de"
  run_dir: "powheg_output"          # Where powheg is run and output files are stored
  log_dir: "powheg_output/logs"      # Where log files are stored
  # Container image - leave empty or omit to run without container
  # Options:
  #   - Registry URL: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"
  #   - Local path: "/path/to/powheg.sif" or "./powheg.sif"
  #   - Empty/omit: run directly without container
  container_image: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"

# ============================================================================
# STAGES TO RUN
# ============================================================================
stages:
  stage1:
    enabled: true
    grid_iterations: 3                 # Grid optimization iterations
    resources:
      cluster: mpi
      ntasks: 10
      time: "23:59:59"
      partition: alma
    powheg_parameters:
      ncall1: 50000

  stage2:
    enabled: true
    resources:
      ntasks: 1
      time: "23:59:59"
      partition: alma

  stage3:
    enabled: true
    grid_combination: false             # Use dedicated grid combination phase

  stage3_gridcombine:
    enabled: false
    use_tmp: true                      # Use local /tmp for speed
    resources:
      ntasks: 3                          # Grid combination: 3 seeds only
      time: "4:00:00"

  stage4:
    enabled: true

  analysis:
    enabled: false                     # Enable after stage 4 completes
    lhef: true
    pythia: true
    weight_correction: true

  addweights:
    enabled: false                     # Enable to add reweighting to events
    rwl_file: "newweights.xml"         # Reweighting XML file
    lhe_dir: "."                       # Directory containing pwgevents-*.lhe files

# ================================================================================
# RESOURCE SETTINGS
# Can be set globally or per stage. If set per stage, global settings are ignored.
# ================================================================================
# For local execution, only 'ntasks' is used (time/partition are ignored).
# GNU parallel runs up to 4 jobs concurrently by default.
resources:
  cluster: mpi                        # Cluster: local, mpi, viper, raven
                                      # Use 'local' for testing with GNU parallel. (The partition is then ignored.)
  ntasks: 1
  time: "24:00:00"
  partition: alma
  mem: 4000

# ================================================================================
# POWHEG PARAMETERS (override powheg.input-save defaults)
# Can be set globally or per stage. If set per stage, global settings are ignored.
# ================================================================================
powheg_parameters:
  # Uncomment to override:
  # ncall1: 50000              # Grid optimization calls
  # ncall2: 100000             # Cross section calls
  # nevents: 100000            # Number of events
  # parallelstage: 3

