# POWgatory run configuration with the settings most runs change.
# All options, with their defaults, are in powgatory/config/config_default.yaml.
#
# Usage: powgatory -c run.yaml

# POWHEG files, relative to the directory powgatory is started from
powheg_executable: "./pwhg_main"
powheg_input_template: "powheg.input-save"

job_settings:
  run_dir: "powheg_output"          # Where POWHEG runs and writes its output
  log_dir: "powheg_output/logs"
  # Registry URL (oras://...), local .sif path, or "" to run without a container
  container_image: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"

stages:
  stage1:
    enabled: true
    grid_iterations: 3
    # Per-stage settings override the global ones below, key by key
    resources:
      ntasks: 1
    powheg_parameters:
      ncall1: 500
  stage2:
    enabled: true
  stage3:
    enabled: true
  stage4:
    enabled: true

# Used by every stage, unless the stage overrides them
resources:
  batch_system: slurm               # slurm or local
  partition: alma
  ntasks: 10                        # Seeds run in parallel
  time: "24:00:00"
  mem: 4000

# Override values in powheg.input-save, for every stage
powheg_parameters:
  # ncall1:  20000
  # ncall2:  20000
  # nubound: 10000
  # numevts:  1000
