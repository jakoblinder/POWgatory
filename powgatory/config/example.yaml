# POWgatory run configuration with the settings most runs change.
# All options, with their defaults, are in powgatory/config/config_default.yaml.
#
# Usage: powgatory -c run.yaml

# POWHEG files, relative to the directory powgatory is started from
powheg_executable: "./pwhg_main"
powheg_input_template: "powheg.input-save"
lhef_executable: "./lhef_analysis"          # For the stage lhef
pythia_executable: "./main-PYTHIA82-lhef"   # For the stage pythia

job_settings:
  run_dir: "powheg_output"          # Where POWHEG runs and writes its output
  log_dir: "powheg_output/logs"
  # Registry URL (oras://...), local .sif path, or "" to run without a container
  container_image: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"

stages:
  stage1:
    enabled: true
    grid_iterations: 3
  stage2:
    enabled: true
  # The first stage-3 seeds combine the grids, one per contribution (auto: read from the input),
  # as a stage of their own; e.g. locally on the login node, without a Slurm time limit
  stage3_fullgrid:
    enabled: false
    resources:
      batch_system: local
  stage3:
    enabled: true
  stage4:
    enabled: true
  # Analysis of every stage-4 event file in <run_dir>/lhef/ and <run_dir>/pythia/, with the
  # upper bound weight correction; the histograms are merged per weight
  lhef:
    enabled: false
  pythia:
    enabled: false

# Used by every stage, unless the stage overrides them
resources:
  batch_system: slurm               # slurm or local
  partition: alma
  submission_type: array
  ntasks: 10                        # Seeds run in parallel
  time: "24:00:00"
  mem: 4000

# Override values in powheg.input-save, for every stage
powheg_parameters:
  # ncall1:  20000
  # ncall2:  20000
  # nubound: 10000
  # numevts:  1000
