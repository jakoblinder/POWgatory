# POWHEG-BOX Run Configuration
# Minimal configuration for a POWHEG run
#
# Usage: powgatory run.yaml
# ============================================================================
# POWHEG FILES (in current directory)
# ============================================================================
powheg_executable: "./pwhg_main"
powheg_input_template: "powheg.input-save"
powheg_seeds_template: "pwgseeds.dat-save"  # Optional
lhef_executable: "./lhef_analysis"          # Used by the stage lhef
pythia_executable: "./main-PYTHIA82-lhef"   # Used by the stage pythia

# ============================================================================
# JOB SUBMISSION SETTINGS
# ============================================================================
job_settings:
  job_name: "powheg"
  mail_type: "None"
  mail_user: ""
  run_dir: "powheg_output"          # Where powheg is run and output files are stored
  log_dir: "powheg_output/logs"     # Where log files are stored
  exclude_nodes: ""                 # Comma-separated list of nodes to exclude
  # Container image - leave empty or omit to run without container
  # Options:
  #   - Registry URL: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"
  #   - Local path: "/path/to/powheg.sif" or "./powheg.sif"
  #   - Empty/omit: run directly without container
  container_image: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"
  # For a local container_image: true copies it to <run_dir>/powheg.sif, false uses it in place
  # (e.g. one image shared by many runs). A registry URL is always pulled into the run_dir.
  copy_container_image: true
  # Script to be run before POWHEGWorkflow is started.
  # For a POWHEGMultiConfigWorkflow this script is run once per config file.
  # It is run in the workflow submission directory (cwd) and not the run_dir.
  presubmit: ""
  # Stuck and lost Slurm jobs (only for submission_type single and array).
  # A branch whose job Slurm lost (node failure, boot failure, preemption), whose job is stuck
  # in COMPLETING (see completing_grace), or whose job is hung (see hung_start_minutes), is
  # resubmitted at most this many times. A branch where POWHEG ran and failed, timed out or ran
  # out of memory is never resubmitted.
  retries: 3
  # A job that stays COMPLETING this many seconds without the branch's outputs is stuck.
  completing_grace: 900
  # A running job whose POWHEG has written nothing into its log after this many minutes is hung,
  # and is cancelled and resubmitted (0 = never checked).
  hung_start_minutes: 15

# ============================================================================
# STAGES TO RUN
# ============================================================================
stages:
  stage1:
    enabled: true
    grid_iterations: 3                 # Grid optimization iterations

  stage2:
    enabled: true
    # The NLO histograms pwg-<seed>-NLO.top of all seeds (written only with testplots 1) are
    # merged into pwg-mean-NLO.top, as a job with this stage's resources. Methods: 1 mean of sets
    # with equal statistics, 2 weighted with 1/error^2, 3 sum, 4 max, 5 min, 6 sum minus the last.
    merge_method: 1

  stage3:
    enabled: true
    grid_combination: false             # Use dedicated grid combination phase

  stage3_gridcombine:
    enabled: false
    use_tmp: true                      # Use local /tmp for speed
    resources:
      ntasks: 3                        # Grid combination: 3 seeds only
      time: "4:00:00"

  stage4:
    enabled: true

  # Analysis of the stage-4 event files, one run per stage-4 seed, in <run_dir>/lhef/ and
  # <run_dir>/pythia/. The number of runs is stage4's ntasks; the other resources and the
  # powheg_parameters can be set per stage, as for stages 1-4.
  lhef:
    enabled: false
    # Multiply the event weights by ub_btilde_corr/ub_remn_corr from pwgcounters-st4-<seed>.dat
    # (needs ubexcess_correct 1 in the POWHEG input).
    weight_correction: true
    # Further files or directories the program needs, linked into <run_dir>/lhef/. Paths are
    # relative to the directory powgatory is started from, or absolute; glob patterns allowed.
    link_files: []
    # The histograms of all seeds are merged per weight, e.g. into pwgLHEF_analysis-mean-W1.top
    # (methods as for stage2).
    merge_method: 1

  pythia:
    enabled: false
    weight_correction: true
    link_files: []
    merge_method: 1

  addweights:
    enabled: false                     # Enable to add reweighting to events
    rwl_file: "newweights.xml"         # Reweighting XML file
    lhe_dir: "."                       # Directory containing pwgevents-*.lhe files

# ================================================================================
# RESOURCE SETTINGS
# Can be set globally or per stage. If set per stage, global settings are ignored.
# ================================================================================
# For local execution, only 'ntasks' is used (time/partition are ignored).
# GNU parallel runs up to 4 jobs concurrently by default.
resources:
  batch_system: slurm                 # Batch system: local or slurm
                                      # Use 'local' for testing with GNU parallel. (The partition is then ignored.)
  submission_type: array              # Slurm submission type: single, array, or mpi
  max_grouping_size: 1000             # Maximum number of tasks to group together in a single job submission
  partition: alma
  ntasks: 1                           # Number of seeds to run in parallel (array jobs) or number of MPI tasks (mpi jobs)
  time: "24:00:00"
  mem: 4000

# ================================================================================
# POWHEG PARAMETERS (override powheg.input-save defaults)
# Can be set globally or per stage. If set per stage, global settings are ignored.
# ================================================================================
powheg_parameters:
  # Uncomment to override:
  # ncall1:  20000   # Grid optimization calls
  # ncall2:  20000   # Cross section calls
  # nubound: 10000   # Upper bound calls
  # numevts:  1000   # Number of events

