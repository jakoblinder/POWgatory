# POWHEG-BOX Run Configuration
# Minimal configuration for a POWHEG run
#
# Usage: powgatory run.yaml
# ============================================================================
# POWHEG FILES (in current directory)
# ============================================================================
powheg_executable: "./pwhg_main"
powheg_input_template: "powheg.input-save"
powheg_seeds_template: "pwgseeds.dat-save"  # Optional
lhef_executable: "./lhef_analysis"          # Used by the stage lhef
pythia_executable: "./main-PYTHIA82-lhef"   # Used by the stage pythia

# ============================================================================
# JOB SUBMISSION SETTINGS
# ============================================================================
job_settings:
  job_name: "powheg"
  mail_type: "None"
  mail_user: ""
  run_dir: "powheg_output"          # Where powheg is run and output files are stored
  log_dir: "powheg_output/logs"     # Where log files are stored
  exclude_nodes: ""                 # Nodes to exclude, as for sbatch --exclude, e.g. "node[01-09],node[15-16]"
  # Container image - leave empty or omit to run without container
  # Options:
  #   - Registry URL: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"
  #   - Local path: "/path/to/powheg.sif" or "./powheg.sif"
  #   - Empty/omit: run directly without container
  container_image: "oras://gitlab-registry.mpcdf.mpg.de/mpp/containers/jlinder/powheg:powheg-latest"
  # For a local container_image: true copies it to <run_dir>/powheg.sif, false uses it in place
  # (e.g. one image shared by many runs). A registry URL is always pulled into the run_dir.
  copy_container_image: true
  # Script to be run before POWHEGWorkflow is started.
  # For a POWHEGMultiConfigWorkflow this script is run once per config file.
  # It is run in the workflow submission directory (cwd) and not the run_dir.
  presubmit: ""
  # Stuck and lost Slurm jobs (only for submission_type single and array).
  # A branch whose job Slurm lost (node failure, boot failure, preemption), whose job is stuck
  # in COMPLETING (see completing_grace), or whose job is hung (see hung_start_minutes), is
  # resubmitted at most this many times. A branch where POWHEG ran and failed, timed out or ran
  # out of memory is never resubmitted.
  retries: 3
  # A job that stays COMPLETING this many seconds without the branch's outputs is stuck.
  completing_grace: 900
  # A running job whose POWHEG has written nothing into its log after this many minutes is hung,
  # and is cancelled and resubmitted (0 = never checked).
  hung_start_minutes: 15
  # How many jobs b2luigi keeps running at the same time: each local branch, local helper task and
  # Slurm submission (one per group of up to max_grouping_size seeds) takes one, pending or running.
  # The command-line option --workers overrides it.
  workers: 250
  # How many POWHEG runs (branches) of stages with batch_system local run at the same time on the
  # node powgatory runs on. auto: the cores free when powgatory starts, i.e. the cores this process
  # may use, but at most the node's cores minus its 5-minute load average. workers still caps all jobs.
  local_parallel_tasks: auto
  # Niceness (0-19, as for nice -n) of the POWHEG and analysis programs of stages with
  # batch_system local. A higher value lets other processes on the node go first when it is busy.
  local_niceness: 0

# ============================================================================
# STAGES TO RUN
# ============================================================================
stages:
  stage1:
    enabled: true
    grid_iterations: 3                 # Grid optimization iterations

  stage2:
    enabled: true
    # The NLO histograms pwg-<seed>-NLO.top of all seeds (written only with testplots 1) are
    # merged into pwg-mean-NLO.top, as a job with this stage's resources. Methods: 1 mean of sets
    # with equal statistics, 2 weighted with 1/error^2, 3 sum, 4 max, 5 min, 6 sum minus the last;
    # 0 no merge.
    merge_method: 1

  # Grid combination: at the start of stage 3, POWHEG combines the stage-2 grids of each
  # contribution (btilde, remn, reg) into a fullgrid file, while all other seeds wait. This can
  # take hours. When enabled, the first stage-3 seeds, one per contribution, run as a stage of
  # their own, and stage 3 runs its other seeds only afterwards. Give this stage its own
  # resources: batch_system local runs it on the node powgatory runs on (e.g. the login node),
  # without a Slurm time limit, or set a longer time for this stage only. Its seeds run with
  # stage3's powheg_parameters (it has none of its own); their logs are stage3_fullgrid-s<seed>.log.
  stage3_fullgrid:
    enabled: false
    # The number of contributions, i.e. of seeds. auto reads them from powheg_input_template with
    # stage3's powheg_parameters, as POWHEG-BOX-RES does: btilde unless withbtilde 0; remn with
    # hdamp > 0, hfact > 0, withdamp 1 or bornzerodamp 1, unless withremnants 0; reg unless
    # withregular 0 (a process without regular contributions then gets one seed more than
    # needed, which waits); remn and reg never with bornonly 1, LOevents 1 or virtonly 1.
    # For other POWHEG versions, set 1, 2 or 3. Stage 3 needs more seeds (ntasks) than this.
    contributions: auto

  stage3:
    enabled: true

  stage4:
    enabled: true

  # Analysis of the stage-4 event files, one run per stage-4 seed, in <run_dir>/lhef/ and
  # <run_dir>/pythia/. The number of runs is stage4's ntasks; the other resources and the
  # powheg_parameters can be set per stage, as for stages 1-4.
  lhef:
    enabled: false
    # Multiply the event weights by ub_btilde_corr/ub_remn_corr from pwgcounters-st4-<seed>.dat
    # (needs ubexcess_correct 1 in the POWHEG input).
    weight_correction: true
    # Further files or directories the program needs, linked into <run_dir>/lhef/. Paths are
    # relative to the directory powgatory is started from, or absolute; glob patterns allowed.
    link_files: []
    # The histograms of all seeds are merged per weight, e.g. into pwgLHEF_analysis-mean-W1.top
    # (methods as for stage2).
    merge_method: 1

  pythia:
    enabled: false
    weight_correction: true
    link_files: []
    merge_method: 1

  addweights:
    enabled: false                     # Enable to add reweighting to events
    rwl_file: "newweights.xml"         # Reweighting XML file
    lhe_dir: "."                       # Directory containing pwgevents-*.lhe files

# ================================================================================
# RESOURCE SETTINGS
# Can be set globally or per stage. A stage takes every key it does not set itself from here.
# ================================================================================
# For local execution, only 'ntasks' is used (time/partition are ignored). How many local branches
# run at the same time is set by job_settings.local_parallel_tasks.
resources:
  batch_system: slurm                 # Batch system: local or slurm
                                      # local runs the branches as processes on the node powgatory runs on.
  submission_type: array              # Slurm submission type: single, array, or mpi
  # Maximum number of seeds grouped into one job submission (one job array or MPI job).
  # auto: the largest group every enabled Slurm stage can submit, the smallest of
  #   - array: the most elements of a job array (MaxArraySize, or max_array_tasks if lower);
  #   - mpi: the most nodes of a job on the stage's partition x seeds per node (Viper: 128 x 128).
  # Set it in this top-level block: stages 1-4 and stage3_fullgrid share one value.
  max_grouping_size: auto
  partition: alma
  ntasks: 1                           # Number of seeds to run in parallel (array jobs) or number of MPI tasks (mpi jobs)
  time: "24:00:00"
  mem: 3500                           # MB per seed; for mpi multiplied by the seeds per node (--mem is per node).
                                      # A job needing more than any node of the partition has, or than it allows, is an error.

# ================================================================================
# POWHEG PARAMETERS (override powheg.input-save defaults)
# Can be set globally or per stage. A stage takes every key it does not set itself from here.
# ================================================================================
powheg_parameters:
  # POWgatory runs every seed as a POWHEG run of its own, which reads its seed from pwgseeds.dat:
  # needed by every stage, also with parallelstage (which POWgatory sets, as xgriditeration).
  manyseeds: 1
  # Uncomment to override:
  # ncall1:  20000   # Grid optimization calls
  # ncall2:  20000   # Cross section calls
  # nubound: 10000   # Upper bound calls
  # numevts:  1000   # Number of events

